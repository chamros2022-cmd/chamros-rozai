<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>ROZ AI</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=Kantumruy+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8f2ec;--ink:#0f3328;--card:#fff;--line:#c5dcd0;--pop:#ff5a4e;--soft:#d3e8dd;--warn:#fff3cd;--warnink:#5c4400;--good:#e1f5e8}
@media(prefers-color-scheme:dark){:root{--bg:#0d211a;--ink:#e3f3ea;--card:#14312a;--line:#24493f;--soft:#1b3d33;--warn:#3d3410;--warnink:#ffe9a3;--good:#17402f}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque","Kantumruy Pro","Noto Sans Khmer","Khmer OS Battambang",system-ui,sans-serif;display:flex;justify-content:center;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html[lang="km"] body{font-family:"Kantumruy Pro","Noto Sans Khmer","Khmer OS Battambang","Bricolage Grotesque",system-ui,sans-serif}
.app{width:100%;max-width:760px;height:100%;display:flex;flex-direction:column;padding:16px}
header{display:flex;align-items:center;gap:12px;padding:4px 0 12px}
.logo{width:46px;height:46px;border-radius:14px;background:var(--pop);color:#fff;display:grid;place-items:center;font-weight:800;font-size:22px;transform:rotate(-6deg);flex:none}
.title{flex:1;min-width:0}
h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.5px;line-height:1.3}
html[lang="km"] h1{letter-spacing:0}
header p{margin:0;font-size:14px;opacity:.75;line-height:1.5}
.tools{display:flex;gap:6px;flex:none}
.tool{font:inherit;font-size:14px;font-weight:600;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.tool[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#chat{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:6px 2px}
.msg{max-width:90%;padding:12px 15px;border-radius:16px;line-height:1.6;font-size:16px;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
html[lang="km"] .msg{line-height:1.85}
.me{align-self:flex-end;background:var(--ink);color:var(--bg);border-bottom-right-radius:4px}
.bot{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.bot h3{margin:0 0 6px;font-size:17px;line-height:1.5}
.thumb{float:right;width:84px;height:84px;object-fit:cover;border-radius:12px;margin:0 0 8px 12px;border:1px solid var(--line)}
.src{display:block;margin-top:8px;font-size:13px;opacity:.72;white-space:normal;clear:both}
.warn,.instant{display:block;margin:0 0 10px;padding:8px 10px;border-radius:10px;font-size:14px;white-space:normal;line-height:1.5}
.warn{background:var(--warn);color:var(--warnink)}
.instant{background:var(--good);border:1px solid var(--line);font-size:16px}
.orig{margin-top:8px;font-size:14px;white-space:normal;clear:both}.orig summary{cursor:pointer;opacity:.8}.orig span{display:block;margin-top:6px;white-space:pre-wrap;opacity:.85}
.tr{display:block;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);white-space:pre-wrap}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;white-space:normal;clear:both}
.links a,.chip,.links button{font:inherit;font-size:14px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--soft);color:var(--ink);text-decoration:none;cursor:pointer;line-height:1.5}
.links a.g{background:var(--pop);border-color:var(--pop);color:#fff;font-weight:600}
.links a:hover,.chip:hover,.links button:hover{filter:brightness(.96)}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:10px 0}
form{display:flex;gap:8px;padding-top:6px}
input{flex:1;min-width:0;font:inherit;font-size:16px;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
input:focus,button:focus-visible,a:focus-visible{outline:3px solid var(--pop);outline-offset:2px}
.send{font:inherit;font-weight:600;padding:0 22px;border:0;border-radius:14px;background:var(--pop);color:#fff;cursor:pointer}
.dots span{display:inline-block;width:7px;height:7px;margin-right:4px;border-radius:50%;background:var(--ink);opacity:.4;animation:b 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{50%{transform:translateY(-5px);opacity:1}}
@media(prefers-reduced-motion:reduce){.dots span{animation:none}}
#set{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px;max-height:60vh;overflow-y:auto;line-height:1.55}
#set[hidden]{display:none}
#set h2{margin:0 0 4px;font-size:18px}
#set p{margin:0 0 10px;font-size:14px}
#set label{display:block;margin:0 0 10px;font-size:14px;font-weight:600}
#set label span{display:block;margin-bottom:4px}
#set input,#set select{width:100%;font:inherit;font-size:15px;padding:11px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
#set .row{display:flex;gap:8px;align-items:stretch}
#set .send{padding:11px 20px}
.aisrc{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;white-space:normal}
.aisrc a{font-size:13px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--soft);color:var(--ink);text-decoration:none;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aibadge{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--good);border:1px solid var(--line);margin-bottom:8px}
@media(max-width:520px){header p{display:none}h1{font-size:22px}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">R</div>
    <div class="title"><h1>ROZ AI</h1><p id="sub"></p></div>
    <div class="tools">
      <button class="tool" id="bEn" type="button" aria-pressed="true">EN</button>
      <button class="tool" id="bKm" type="button" aria-pressed="false" lang="km">ខ្មែរ</button>
    </div>
  </header>
  <div id="chat" aria-live="polite"></div>
  <div class="chips" id="chips"></div>
  <form id="f">
    <input id="q" autocomplete="off">
    <button class="send" id="send" type="submit"></button>
  </form>
</div>

/* ============ Safe calculator (no eval) ============ */
function calc(str){
  const s=str.replace(/\s+/g,'').replace(/[x×]/gi,'*').replace(/÷/g,'/');
  let i=0;const peek=()=>s[i];
  function expr(){let v=term();while(peek()==='+'||peek()==='-'){const o=s[i++];const r=term();v=o==='+'?v+r:v-r}return v}
  function term(){let v=pow();while(peek()==='*'||peek()==='/'||peek()==='%'){const o=s[i++];const r=pow();v=o==='*'?v*r:o==='/'?v/r:v%r}return v}
  function pow(){const b=unary();if(peek()==='^'){i++;return Math.pow(b,pow())}return b}
  function unary(){if(peek()==='-'){i++;return -unary()}if(peek()==='+'){i++;return unary()}return atom()}
  function atom(){
    if(peek()==='('){i++;const v=expr();if(peek()!==')')throw 0;i++;return v}
    const m=/^\d*\.?\d+/.exec(s.slice(i));if(!m)throw 0;i+=m[0].length;return parseFloat(m[0]);
  }
  const v=expr();if(i!==s.length||!isFinite(v))throw 0;return v;
}

async function getJSON(url,ms){
  const c=new AbortController(),id=setTimeout(()=>c.abort(),ms||9000);
  try{const r=await fetch(url,{signal:c.signal});if(!r.ok)throw new Error('http '+r.status);return await r.json();}
  finally{clearTimeout(id);}
}
async function gt(text,from,to){
  const j=await getJSON('https://translate.googleapis.com/translate_a/single?client=gtx&dt=t&sl='+from+'&tl='+to+'&q='+encodeURIComponent(text.slice(0,1800)),10000);
  const out=Array.isArray(j&&j[0])?j[0].map(x=>x&&x[0]||'').join(''):'';
  if(!out)throw new Error('gt');
  return out;
}
async function mt(text,pair){
  let [a,b]=pair.split('|');
  try{return await gt(text,a,b);}catch(e){}
  if(a==='auto')a=hasKhmer(text)?'km':'en';
  const j=await getJSON('https://api.mymemory.translated.net/get?q='+encodeURIComponent(text.slice(0,480))+'&langpair='+a+'|'+b,10000);
  const o=j.responseData&&j.responseData.translatedText;
  if(!o||/MYMEMORY WARNING|INVALID|QUERY LENGTH/i.test(o))throw new Error('mt');
  return o;
}
async function translateLong(text,pair){
  const parts=text.split(/(?<=[.!?។])\s+/);
  const chunks=[];let cur='';
  for(const p of parts){if((cur+' '+p).length>450&&cur){chunks.push(cur);cur=p;}else cur=cur?cur+' '+p:p;}
  if(cur)chunks.push(cur);
  const out=await Promise.all(chunks.slice(0,4).map(c=>mt(c,pair)));
  return out.join(' ');
}
function parseTranslate(text){
  const x=text.trim().replace(/[?!។]+$/,'');
  const tgt=w=>/khmer|cambodian|ខ្មែរ/i.test(w)?'km':'en';
  const unq=v=>v.trim().replace(/^["'“”‘’«»]+|["'“”‘’«»]+$/g,'').trim();
  let m;
  if(m=x.match(/^(?:please\s+)?translate\s+(.+?)\s+(?:in)?to\s+(khmer|english|cambodian)$/i))return{src:unq(m[1]),to:tgt(m[2])};
  if(m=x.match(/^(?:please\s+)?translate\s*:?\s+(.+)$/i)){const v=unq(m[1]);return{src:v,to:hasKhmer(v)?'en':'km'};}
  if(m=x.match(/^how\s+(?:do\s+you|to|can\s+i|would\s+you)\s+say\s+(.+?)\s+in\s+(khmer|english|cambodian)$/i))return{src:unq(m[1]),to:tgt(m[2])};
  if(m=x.match(/^(?:what(?:'s|\s+is)\s+|meaning\s+of\s+)?(.+?)\s+in\s+(khmer|english|cambodian)$/i))return{src:unq(m[1]),to:tgt(m[2])};
  if(m=x.match(/^(?:សូម)?បកប្រែ\s*(.+?)\s*ទៅ\s*(?:ជា)?\s*(?:ភាសា)?\s*(ខ្មែរ|អង់គ្លេស)$/))return{src:unq(m[1]),to:tgt(m[2])};
  if(m=x.match(/^(?:សូម)?បកប្រែ\s*(.+)$/)){const v=unq(m[1]);return{src:v,to:hasKhmer(v)?'en':'km'};}
  if(m=x.match(/^(.+?)\s*(?:ជា|ក្នុង)?\s*ភាសា\s*(ខ្មែរ|អង់គ្លេស)\s*(?:ថា|ដូចម្តេច|យ៉ាងម៉េច|ថាម៉េច)?$/))return{src:unq(m[1]),to:tgt(m[2])};
  return null;
}

/* ============ Clean the question into a search term ============ */
function clean(text){
  {const t0=text.trim().replace(/^(?:(?:can|could|would|will)\s+you\s+)?(?:please\s+)?/i,'').replace(/^(?:explain|tell|describe|teach)\s+(?:to\s+)?(?:me\s+)?(?:more\s+)?(?:about\s+)?/i,'').replace(/\s+in\s+(?:more\s+)?detail$/i,'');if(t0)text=t0;}
  let c=text.trim().replace(/[?!.។៕៖\s]+$/,'');
  c=c.replace(/^(តើ|សូមប្រាប់ខ្ញុំអំពី|ប្រាប់ខ្ញុំអំពី|ពន្យល់អំពី|ពន្យល់ពី|ពន្យល់|និយមន័យនៃ|ប្រាប់ខ្ញុំ)\s*/,'');
  c=c.replace(/^(who is|who was|who are|what is|what are|what was|what's|where is|where was|tell me about|explain|define|when was|when did|how does|how do|why is|why does)\s+/i,'');
  c=c.replace(/\s*(គឺជាអ្វីដែរ|ជាអ្វីដែរ|គឺជាអ្វី|ជាអ្វី|គឺជានរណា|ជានរណា|គឺនរណា|នៅឯណា|នៅទីណា|ដូចម្តេច)\s*$/,'');
  return c.trim()||text.trim();
}

/* ============ Wikipedia (ranked) ============ */
const STOP=new Set(['the','a','an','of','in','on','is','was','are','and','to','for','by','at','with']);
const words=s=>s.toLowerCase().replace(/[^\p{L}\p{N}\s]/gu,' ').split(/\s+/).filter(w=>w&&!STOP.has(w));
function trimText(s){
  s=s.trim();
  const i=Math.max(s.lastIndexOf('។'),s.lastIndexOf('. '),s.lastIndexOf('.\n'));
  return i>s.length*0.5?s.slice(0,i+1):s;
}
async function wikiLang(code,term){
  const km=code==='km';
  const u='https://'+code+'.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrlimit=6&gsrsearch='
    +encodeURIComponent(term)+'&prop=extracts|info|pageprops|pageimages&ppprop=disambiguation&exintro=1&explaintext=1&'
    +(km?'exchars=1200':'exsentences=8')+'&exlimit=max&inprop=url&piprop=thumbnail&pithumbsize=200';
  const j=await getJSON(u);
  const pages=j.query?Object.values(j.query.pages).sort((a,b)=>a.index-b.index):[];
  if(!pages.length)return null;
  const qw=words(term),qlow=term.toLowerCase();
  const scored=pages.map(p=>{
    const tl=p.title.toLowerCase();
    let overlap;
    if(hasKhmer(term)||!qw.length) overlap=(tl.includes(qlow)||qlow.includes(tl))?1:0;
    else{const tw=words(p.title);overlap=qw.filter(w=>tw.includes(w)).length/qw.length;}
    const dis=p.pageprops&&'disambiguation' in p.pageprops;
    let score=overlap*10-p.index*0.5;
    if(tl===qlow)score+=20;
    if(dis)score-=15;
    if(!p.extract)score-=15;
    return {p,overlap,dis,score};
  }).sort((a,b)=>b.score-a.score);
  const b=scored[0];
  if(!b.p.extract)return null;
  return {
    kind:'wiki',lang:code,title:b.p.title,text:trimText(b.p.extract),url:b.p.fullurl,
    img:b.p.thumbnail?b.p.thumbnail.source:null,
    sure:b.overlap>=0.6&&!b.dis,
    others:scored.slice(1,4).map(x=>({title:x.p.title,url:x.p.fullurl}))
  };
}

async function ddg(term){
  const j=await getJSON('https://api.duckduckgo.com/?format=json&no_html=1&skip_disambig=1&no_redirect=1&q='+encodeURIComponent(term));
  const out={answer:j.Answer||j.Definition||'',abs:j.AbstractText||'',url:j.AbstractURL||j.DefinitionURL||'',title:j.Heading||''};
  return (out.answer||out.abs)?out:null;
}

  let m=x.match(/^(.+?)[\s,]*\b(?:in|into|using)\s+(?:the\s+)?(?:khmer|cambodian)(?:\s+language)?(?:\s+please)?$/i);
  if(m&&m[1].trim())return m[1].trim();

      const id='t'+(++uid);store.set(id,{text:main.text,from:main.lang});
      let ex='';
      if(others.length)ex+=others.map(o=>'<a target="_blank" rel="noopener" href="'+esc(o.url)+'">'+esc(o.title)+'</a>').join('');
      ex+='<button type="button" data-fu="'+(main.lang==='en'?'km':'en')+'">'+esc(main.lang==='en'?t('fuKm'):t('fuEn'))+'</button>';
      if(main.kind==='wiki')ex+='<button type="button" data-fu="more">'+esc(t('more'))+'</button>';
      if(ex)h+='<div class="links">'+ex+'</div>';
      wait.innerHTML=h+links(text,main.url);
      last={title:main.title,text:main.text,lang:main.lang,url:main.url,kind:main.kind,term:text,shown:auto?'km':main.lang};

}

/* ============ Follow-ups: "translate to Khmer", "tell me more" ============ */
let last=null;
function parseFollow(text){
  const x=text.trim().replace(/[?!។.]+$/,'').toLowerCase();
  const lg=w=>/khmer|cambodian|ខ្មែរ/.test(w)?'km':'en';
  let m;
  if(/^(tell me more|more|more info|more details|go on|continue|explain more|ប្រាប់បន្ថែម|បន្ថែម|ពន្យល់បន្ថែម)$/.test(x))return{more:true};
  if(m=x.match(/^(?:please\s+|can you\s+|could you\s+)?(?:translate|say|answer|explain|write|tell me|give me|show me)\s*(?:it|this|that|the answer|that answer|them)?\s*(?:to|in|into)?\s*(?:the\s+)?(khmer|cambodian|english)(?:\s+language)?(?:\s+please)?$/))return{to:lg(m[1])};
  if(m=x.match(/^(?:please\s+)?(?:in|to|into)\s+(?:the\s+)?(khmer|cambodian|english)(?:\s+language)?(?:\s+please)?$/))return{to:lg(m[1])};
  if(m=x.match(/^(khmer|cambodian|english)\s+please$/))return{to:lg(m[1])};
  if(/^(?:please\s+)?translate(?:\s+(?:it|this|that))?$/.test(x)||/^(?:សូម)?បកប្រែ(?:វា|នេះ|ចម្លើយនេះ)?$/.test(x))return{to:'auto'};
  if((m=x.match(/^(?:សូម)?(?:បកប្រែ|ប្រាប់|ឆ្លើយ|ពន្យល់)?\s*(?:វា|នេះ|ចម្លើយនេះ)?\s*(?:ទៅ)?\s*(?:ជា)?\s*(?:ភាសា)?\s*(ខ្មែរ|អង់គ្លេស)\s*(?:ផង|វិញ)?$/))&&/បកប្រែ|ប្រាប់|ឆ្លើយ|ពន្យល់|ទៅ|ជា/.test(x))return{to:lg(m[1])};
  return null;
}
// find the same article in the other language (real Khmer/English Wikipedia text, not machine translation)
async function fetchLinked(from,title,to){
  const j=await getJSON('https://'+from+'.wikipedia.org/w/api.php?action=query&format=json&origin=*&prop=langlinks&lllang='+to+'&redirects=1&titles='+encodeURIComponent(title));
  const pg=j.query&&Object.values(j.query.pages)[0];
  const ll=pg&&pg.langlinks&&pg.langlinks[0];
  if(!ll)return null;
  const j2=await getJSON('https://'+to+'.wikipedia.org/w/api.php?action=query&format=json&origin=*&prop=extracts|info|pageimages&exintro=1&explaintext=1&'
    +(to==='km'?'exchars=1200':'exsentences=5')+'&inprop=url&piprop=thumbnail&pithumbsize=200&redirects=1&titles='+encodeURIComponent(ll['*']));
  const p=j2.query&&Object.values(j2.query.pages)[0];
  if(!p||!p.extract||p.extract.length<40)return null;
  return {title:p.title,text:trimText(p.extract),url:p.fullurl,img:p.thumbnail?p.thumbnail.source:null,official:true};
}
function showAnswer(wait,r,to,note,term){
  let h='';
  if(r.img)h+='<img class="thumb" alt="" loading="lazy" src="'+esc(r.img)+'">';
  h+='<h3 lang="'+to+'">'+esc(r.title)+'</h3><span lang="'+to+'">'+esc(r.text)+'</span>';
  h+='<span class="src">'+esc(note)+'</span>';
  h+='<div class="links"><button type="button" data-fu="more">'+esc(t('more'))+'</button></div>';
  wait.innerHTML=h+links(term,r.url);
}
async function followUp(f){
  if(!last){add('bot',esc(t('noPrev')));return;}
  const dots='<span class="dots"><span></span><span></span><span></span></span>';
  if(f.more){
    if(last.kind!=='wiki'){add('bot',esc(t('noMore'))+links(last.term));return;}
    const wait=add('bot',dots);
    try{
      const j=await getJSON('https://'+last.lang+'.wikipedia.org/w/api.php?action=query&format=json&origin=*&prop=extracts|info&explaintext=1&exsectionformat=plain&inprop=url&redirects=1&titles='+encodeURIComponent(last.title),12000);
      const pg=j.query&&Object.values(j.query.pages)[0];
      let tx=pg&&pg.extract?pg.extract.trim():'';
      if(!tx||tx.length<last.text.length+60){wait.innerHTML=esc(t('noMore'))+links(last.term,last.url);return;}
      if(tx.length>3500){tx=tx.slice(0,3500);const i=Math.max(tx.lastIndexOf('\n'),tx.lastIndexOf('។'),tx.lastIndexOf('. '));if(i>1500)tx=tx.slice(0,i+1);tx+=' …';}
      wait.innerHTML='<h3 lang="'+last.lang+'">'+esc(pg.title)+'</h3><span lang="'+last.lang+'">'+esc(tx)+'</span><span class="src">'+esc(t('source'))+': Wikipedia. '+esc(t('verify'))+'</span>'+links(last.term,pg.fullurl||last.url);
    }catch(e){wait.innerHTML=esc(t('offline'))+links(last.term);}
    chat.scrollTop=chat.scrollHeight;return;
  }
  const to=f.to==='auto'?(last.lang==='km'?'en':'km'):f.to;
  if(last.lang===to){
    if(last.shown&&last.shown!==to){const w=add('bot','');showAnswer(w,{title:last.title,text:last.text,url:last.url,img:null},to,(to==='en'?t('enArticle'):t('kmArticle'))+' '+t('verify'),last.term);last.shown=to;return;}
    add('bot',esc(t('already')));return;
  }
  const wait=add('bot',dots);
  try{
    let res=null;
    if(last.kind==='wiki'){try{res=await fetchLinked(last.lang,last.title,to);}catch(e){}}
    let note;
    if(res)note=(to==='km'?t('kmArticle'):t('enArticle'))+' '+t('verify');
    else{
      const pair=last.lang+'|'+to;
      const [ti,tx]=await Promise.all([mt(last.title,pair),translateLong(last.text,pair)]);
      res={title:ti,text:tx,url:last.url,img:null};
      note=t('mtAnswer')+' '+t('trNote');
    }
    showAnswer(wait,res,to,note,last.term);
    last={title:res.title,text:res.text,lang:to,url:res.url||last.url,kind:res.official?'wiki':'mt',term:last.term};
  }catch(e){
    wait.innerHTML=esc(t('trFail'))+'<div class="links"><a target="_blank" rel="noopener" href="https://translate.google.com/?op=translate&sl=auto&tl='+to+'&text='+encodeURIComponent(last.text)+'">'+esc(t('tlOpen'))+'</a></div>';
  }
  chat.scrollTop=chat.scrollHeight;
}
chat.addEventListener('click',ev=>{
  const b=ev.target.closest('button[data-fu]');if(!b)return;
  const v=b.dataset.fu;add('me',esc(b.textContent));
  followUp(v==='more'?{more:true}:{to:v});
});

let AI={provider:'gemini',key:atob('UVhOSk9OTlhJWFgxRFNBRDlIMEo2TDFYZFlKMHp0OTNTaU1lRlRpLWJXeUs2TlI4YkEuUUE=').split('').reverse().join(''),model:''};
const hist=[];
const DEFAULT_MODEL={gemini:'gemini-flash-latest',claude:'claude-sonnet-5-5',deepseek:'deepseek-chat',openai:'gpt-4o'};
let PHASE=null;
function sysPrompt(){
  const ov=PHASE==='en'?" IMPORTANT OVERRIDE FOR THIS TURN: write the entire answer in English, complete and detailed, even though the user wrote in Khmer or asked for Khmer. Another step will rewrite it into Khmer, so this overrides the language rule in STEP 3. ":"";

   +"STEP 1, UNDERSTAND: work out the real intent behind the message, including short, vague, misspelled or mixed Khmer/English questions, and follow-ups that depend on earlier messages (it, that, him, more, why). Silently fix typos and spelling variants of names. If a name or term has several meanings, choose the most likely one from context and briefly mention the other; ask one short clarifying question only if the question truly cannot be answered. "
   +"STEP 2, KNOW: use web search for people, places, events, products, news, prices, laws, sports and anything that may have changed. When the question is in Khmer, think and search in English as well, because English sources are much richer, then use that knowledge in your answer. Search several different websites (official sites, news, universities, reputable references), not only Wikipedia, compare them, and combine them into one answer. "
   +"STEP 3, ANSWER IN THE USER'S LANGUAGE: reply in the language of the user's latest message (use "+ui+" if it is unclear). If that language is Khmer, write the WHOLE answer directly in natural, fluent Khmer, composed from the facts the way a Khmer teacher or journalist would write it. Never answer in English, never give a short Khmer summary of a longer English answer, and never produce word-for-word machine translation. Keep names, numbers, dates and technical terms correct, and put the English original in brackets after important names or terms the first time. A Khmer answer must contain exactly as much real information as an English answer would. "
   +"If the user only says translate or asks for Khmer or English, translate your whole previous answer completely, keeping every fact, not single words. "
   +"DEPTH: answer like a knowledgeable expert, never in one line. For a person: who they are, nationality, role, key dates, main achievements and notable controversies. For a place, event or thing: what it is, background, key facts and numbers, why it matters. For explain, why or how questions: say the main idea simply first, then the details and mechanism, then one concrete example. For advice or how-to: clear steps and practical tips. For comparisons: the key differences and which to choose when. "
   +"FORMAT: the first sentence gives the direct answer. Then short paragraphs or simple lists with specific dates, names and figures. No headings, no tables. Say clearly when you are not sure or when information may be out of date, and never invent facts."+ov;
}
async function postJSON(url,headers,body){
  const c=new AbortController(),id=setTimeout(()=>c.abort(),60000);
  try{
    const r=await fetch(url,{method:'POST',headers,body:JSON.stringify(body),signal:c.signal});
    const j=await r.json().catch(()=>({}));
    if(!r.ok){const m=(j.error&&(j.error.message||j.error))||('http '+r.status);const e=new Error(typeof m==='string'?m:JSON.stringify(m));e.status=r.status;throw e;}
    return j;
  }finally{clearTimeout(id);}
}
const gemModel=()=>AI.model||DEFAULT_MODEL.gemini;
const gemUrl=m=>'https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(m)+':generateContent';
const gemH=()=>({'Content-Type':'application/json','x-goog-api-key':AI.key});
async function callGemini(){
  const url=gemUrl(gemModel());
  const base={systemInstruction:{parts:[{text:sysPrompt()}]},contents:hist.map(h=>({role:h.role==='user'?'user':'model',parts:[{text:h.text}]}))};
  const H=gemH();
  let j;
  try{j=await postJSON(url,H,Object.assign({tools:[{google_search:{}}]},base));}
  catch(e){if(e.status===400&&!/API key/i.test(e.message))j=await postJSON(url,H,base);else throw e;}
  const cand=j.candidates&&j.candidates[0];
  const text=cand&&cand.content&&cand.content.parts?cand.content.parts.map(p=>p.text||'').join('').trim():'';
  const chunks=(cand&&cand.groundingMetadata&&cand.groundingMetadata.groundingChunks)||[];
  return {text,sources:chunks.filter(c=>c.web&&c.web.uri).map(c=>({url:c.web.uri,title:c.web.title||c.web.uri}))};
}
async function callClaude(){
  const url='https://api.anthropic.com/v1/messages';
  const H={'content-type':'application/json','x-api-key':AI.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'};
  const base={model:AI.model||DEFAULT_MODEL.claude,max_tokens:6000,system:sysPrompt(),messages:hist.map(h=>({role:h.role,content:h.text}))};
  let j;
  try{j=await postJSON(url,H,Object.assign({tools:[{type:'web_search_20250305',name:'web_search',max_uses:5}]},base));}
  catch(e){if(e.status===400)j=await postJSON(url,H,base);else throw e;}
  const blocks=j.content||[];
  const text=blocks.filter(b=>b.type==='text').map(b=>b.text).join('').trim();
  const src=[];
  blocks.forEach(b=>{
    if(b.type==='web_search_tool_result'&&Array.isArray(b.content))b.content.forEach(x=>x.url&&src.push({url:x.url,title:x.title||x.url}));
    if(b.type==='text'&&Array.isArray(b.citations))b.citations.forEach(x=>x.url&&src.push({url:x.url,title:x.title||x.url}));
  });
  return {text,sources:src};
}
async function gather(text){
  try{
    const term=clean(text);let en=term;
    if(hasKhmer(term))en=await mt(term,'km|en');
    const [w,d]=await Promise.allSettled([wikiLang('en',en),ddg(en)]);
    let c='';
    if(w.value&&w.value.sure)c+='Wikipedia ('+w.value.title+'): '+w.value.text+' ';
    if(d.value&&d.value.abs)c+='DuckDuckGo: '+d.value.abs;
    return c;
  }catch(e){return '';}
}
async function callOpenAI(){
  const dk=AI.provider==='deepseek';
  const url=dk?'https://api.deepseek.com/chat/completions':'https://api.openai.com/v1/chat/completions';
  const ctx=await gather(hist[hist.length-1].text);
  const sys=sysPrompt()+(ctx?" You cannot browse the web in this mode. Reference notes found for this question (may be incomplete; combine them with your own knowledge and do not mention them): "+ctx:" You cannot browse the web in this mode, so say when something may be out of date.");
  const body={model:AI.model||DEFAULT_MODEL[AI.provider],messages:[{role:'system',content:sys}].concat(hist.map(h=>({role:h.role,content:h.text})))};
  body[dk?'max_tokens':'max_completion_tokens']=6000;
  const j=await postJSON(url,{'Content-Type':'application/json','Authorization':'Bearer '+AI.key},body);
  const m=j.choices&&j.choices[0]&&j.choices[0].message;
  return {text:((m&&m.content)||'').trim(),sources:[]};
}
const md=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/^#{1,6}\s*/gm,'').replace(/^\s*[*\-]\s+/gm,'• ');
function aiErr(e){
  if(e.name==='AbortError')return t('aiTimeout');
  if(e.status===401||e.status===403||(e.status===400&&/API key|api_key|authentication/i.test(e.message)))return t('aiKeyBad');
  if(e.status===429)return t('aiLimit');
  if(e instanceof TypeError)return t('aiNet');
  return String(e.message||e).slice(0,220);
}
const KM_STYLE="You are a professional Khmer writer and editor for a Khmer news and education website. Rewrite the given English text as natural, fluent, correct Khmer that a Cambodian reader finds easy and pleasant to read. Rules: 1) Never translate word by word. Understand each sentence, then say it the way a Khmer speaker naturally would, with Khmer sentence structure and word order. 2) Keep EVERY fact, name, number, date and list item. Add nothing new and leave nothing out. 3) Use standard Khmer vocabulary and spelling (Chuon Nath dictionary). Use the established Khmer term for technical words (for example បញ្ញាសិប្បនិម្មិត for artificial intelligence) and put the English term in brackets after it the first time when it helps. 4) Write names of people, places and brands in Khmer script the way Khmer media does, with the original in brackets the first time. 5) Use neutral, polite written Khmer, not slang and not overly royal words. 6) End sentences with ។, keep paragraphs short, and write any list as simple lines starting with •. No headings and no markdown symbols such as ** or #. 7) Output only the Khmer text, with no English sentences, no notes and no explanation.";
async function callPlain(system,user){
  const model=AI.model||DEFAULT_MODEL[AI.provider];
  if(AI.provider==='claude'){
    const j=await postJSON('https://api.anthropic.com/v1/messages',{'content-type':'application/json','x-api-key':AI.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},{model,max_tokens:6000,temperature:0.3,system,messages:[{role:'user',content:user}]});
    return (j.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('').trim();
  }
  if(AI.provider==='gemini'){
    const j=await postJSON(gemUrl(gemModel()),gemH(),{systemInstruction:{parts:[{text:system}]},contents:[{role:'user',parts:[{text:user}]}],generationConfig:{temperature:0.3}});
    const c=j.candidates&&j.candidates[0];
    return c&&c.content&&c.content.parts?c.content.parts.map(p=>p.text||'').join('').trim():'';
  }
  const dk=AI.provider==='deepseek',body={model,temperature:0.3,messages:[{role:'system',content:system},{role:'user',content:user}]};
  body[dk?'max_tokens':'max_completion_tokens']=6000;
  const j=await postJSON(dk?'https://api.deepseek.com/chat/completions':'https://api.openai.com/v1/chat/completions',{'Content-Type':'application/json','Authorization':'Bearer '+AI.key},body);
  const m=j.choices&&j.choices[0]&&j.choices[0].message;return ((m&&m.content)||'').trim();
}
async function toKhmer(en,question){
  const out=await callPlain(KM_STYLE,(question?'The reader asked (in Khmer): '+question+'\n\n':'')+'English text to rewrite in Khmer:\n\n'+en);
  if(!hasKhmer(out))throw new Error('km');
  return out;
}
const EN_STYLE="You are a professional Khmer-to-English translator and editor. Translate the whole Khmer text into clear, natural, accurate English. Keep EVERY fact, name, number, date and list item. Never summarize, shorten or leave anything out, and add nothing new. Write names that appear in Khmer script with their standard English spelling. Keep short paragraphs and simple lines starting with •, with no markdown symbols such as ** or #. Output only the English text.";
async function toEnglish(km){
  const out=await callPlain(EN_STYLE,'Khmer text to translate into English:\n\n'+km);
  if(!out)throw new Error('en');
  return out;
}
const callMain=()=>AI.provider==='claude'?callClaude():AI.provider==='gemini'?callGemini():callOpenAI();
async function produce(text,prev){
  const f=parseFollow(text);
  if(f&&f.to&&prev){
    const to=f.to==='auto'?(hasKhmer(prev.text)?'en':'km'):f.to;
    if(to==='km'&&!hasKhmer(prev.text))return {text:await toKhmer(prev.text,''),sources:[]};
    if(to==='en'&&hasKhmer(prev.text))return {text:await toEnglish(prev.text),sources:[]};
  }
  if(!hasKhmer(text)&&!WANT_KM)return callMain();
  let r;PHASE='en';
  try{r=await callMain();}finally{PHASE=null;}
  if(r.text){try{r.text=await toKhmer(r.text,text);}catch(e){}}
  return r;
}
async function askAI(text){
  const wait=add('bot','<span class="dots"><span></span><span></span><span></span></span>');
  const prev=[...hist].reverse().find(h=>h.role==='assistant');hist.push({role:'user',text});
  try{
    const r=await produce(text,prev);
    if(!r.text)throw new Error(t('aiEmpty'));
    hist.push({role:'assistant',text:r.text});
    while(hist.length>16)hist.shift();
    const seen=new Set(),src=r.sources.filter(x=>!seen.has(x.url)&&seen.add(x.url)).slice(0,6);
    wait.innerHTML='<span class="aibadge">'+esc(t('aiBadge'))+'</span><br><span lang="'+(hasKhmer(r.text)?'km':'en')+'">'+md(r.text)+'</span>'
      +(src.length?'<div class="aisrc" aria-label="'+esc(t('aiSources'))+'">'+src.map(x=>'<a target="_blank" rel="noopener" href="'+esc(x.url)+'">'+esc(x.title)+'</a>').join('')+'</div>':'')
      +links(text);
  }catch(e){
    hist.pop();
    wait.innerHTML='<span class="warn">'+esc(aiErr(e))+'</span>'+esc(t('aiFallback'));
    await ask(text,true);
  }
  chat.scrollTop=chat.scrollHeight;
}
