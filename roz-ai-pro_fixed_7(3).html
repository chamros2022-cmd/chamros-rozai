<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>ROZ AI</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=Kantumruy+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8f2ec;--ink:#0f3328;--card:#fff;--line:#c5dcd0;--pop:#ff5a4e;--soft:#d3e8dd;--warn:#fff3cd;--warnink:#5c4400;--good:#e1f5e8}
@media(prefers-color-scheme:dark){:root{--bg:#0d211a;--ink:#e3f3ea;--card:#14312a;--line:#24493f;--soft:#1b3d33;--warn:#3d3410;--warnink:#ffe9a3;--good:#17402f}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque","Kantumruy Pro","Noto Sans Khmer","Khmer OS Battambang",system-ui,sans-serif;display:flex;justify-content:center;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html[lang="km"] body{font-family:"Kantumruy Pro","Noto Sans Khmer","Khmer OS Battambang","Bricolage Grotesque",system-ui,sans-serif}
.app{width:100%;max-width:760px;height:100%;display:flex;flex-direction:column;padding:16px}
header{display:flex;align-items:center;gap:12px;padding:4px 0 12px}
.logo{width:46px;height:46px;border-radius:14px;background:var(--pop);color:#fff;display:grid;place-items:center;font-weight:800;font-size:22px;transform:rotate(-6deg);flex:none}
.title{flex:1;min-width:0}
h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.5px;line-height:1.3}
html[lang="km"] h1{letter-spacing:0}
header p{margin:0;font-size:14px;opacity:.75;line-height:1.5}
.tools{display:flex;gap:6px;flex:none}
.tool{font:inherit;font-size:14px;font-weight:600;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.tool[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#chat{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:6px 2px}
.msg{max-width:90%;padding:12px 15px;border-radius:16px;line-height:1.6;font-size:16px;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
html[lang="km"] .msg{line-height:1.85}
.me{align-self:flex-end;background:var(--ink);color:var(--bg);border-bottom-right-radius:4px}
.bot{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.bot h3{margin:0 0 6px;font-size:17px;line-height:1.5}
.thumb{float:right;width:84px;height:84px;object-fit:cover;border-radius:12px;margin:0 0 8px 12px;border:1px solid var(--line)}
.src{display:block;margin-top:8px;font-size:13px;opacity:.72;white-space:normal;clear:both}
.warn,.instant{display:block;margin:0 0 10px;padding:8px 10px;border-radius:10px;font-size:14px;white-space:normal;line-height:1.5}
.warn{background:var(--warn);color:var(--warnink)}
.instant{background:var(--good);border:1px solid var(--line);font-size:16px}
.orig{margin-top:8px;font-size:14px;white-space:normal;clear:both}.orig summary{cursor:pointer;opacity:.8}.orig span{display:block;margin-top:6px;white-space:pre-wrap;opacity:.85}
.tr{display:block;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);white-space:pre-wrap}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;white-space:normal;clear:both}
.links a,.chip,.links button{font:inherit;font-size:14px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--soft);color:var(--ink);text-decoration:none;cursor:pointer;line-height:1.5}
.links a.g{background:var(--pop);border-color:var(--pop);color:#fff;font-weight:600}
.links a:hover,.chip:hover,.links button:hover{filter:brightness(.96)}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:10px 0}
form{display:flex;gap:8px;padding-top:6px}
input{flex:1;min-width:0;font:inherit;font-size:16px;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
input:focus,button:focus-visible,a:focus-visible{outline:3px solid var(--pop);outline-offset:2px}
.send{font:inherit;font-weight:600;padding:0 22px;border:0;border-radius:14px;background:var(--pop);color:#fff;cursor:pointer}
.dots span{display:inline-block;width:7px;height:7px;margin-right:4px;border-radius:50%;background:var(--ink);opacity:.4;animation:b 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{50%{transform:translateY(-5px);opacity:1}}
@media(prefers-reduced-motion:reduce){.dots span{animation:none}}
.aisrc{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;white-space:normal}
.aisrc a{font-size:13px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--soft);color:var(--ink);text-decoration:none;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aibadge{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--good);border:1px solid var(--line);margin-bottom:8px}
@media(max-width:520px){header p{display:none}h1{font-size:22px}}

.code{margin:10px 0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--soft);white-space:normal}
.code .ch{display:flex;align-items:center;gap:6px;padding:6px 10px;font-size:13px;font-weight:700;border-bottom:1px solid var(--line)}
.code .ch span{flex:1;text-transform:uppercase;letter-spacing:.5px;opacity:.7}
.code .ch button{font:inherit;font-size:13px;font-weight:600;padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.code .ch button.run{background:var(--pop);color:#fff;border-color:var(--pop)}
.code pre{margin:0;padding:10px 12px;overflow-x:auto;white-space:pre;font:13.5px/1.55 ui-monospace,Menlo,Consolas,monospace;text-align:left}
.code .out{margin:0;padding:8px 12px;border-top:1px dashed var(--line);font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;background:var(--card);display:none}
.code .out.err{color:#b3261e}
.code iframe{display:none;width:100%;height:240px;border:0;border-top:1px dashed var(--line);background:#fff}
#calc{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
#calc.open{display:flex}
.cbox{width:100%;max-width:370px;max-height:100%;overflow:auto;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.chead{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:8px}.chead span{flex:1}
.chead button,.cfoot button,#chist button{font:inherit;font-size:14px;font-weight:600;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--soft);color:var(--ink);cursor:pointer}
#cdisp{width:100%;font:600 22px ui-monospace,Menlo,Consolas,monospace;text-align:right;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
#cres{min-height:26px;margin:8px 2px;font:600 15px/1.55 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere}
.cgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cgrid button{font:inherit;font-size:17px;font-weight:600;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--soft);color:var(--ink);cursor:pointer;padding:0}
.cgrid button.n{background:var(--card)}.cgrid button.eq{background:var(--pop);border-color:var(--pop);color:#fff}
.cfoot{display:flex;gap:8px;margin-top:10px}.cfoot button{flex:1}
#chist{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}#chist button{font-size:12px;padding:3px 9px;font-family:ui-monospace,Menlo,monospace}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">R</div>
    <div class="title"><h1>ROZ AI</h1><p id="sub"></p></div>
    <div class="tools">
      <button class="tool" id="bCalc" type="button" aria-label="Calculator" title="Calculator">🧮</button>
      <button class="tool" id="bEn" type="button" aria-pressed="true">EN</button>
      <button class="tool" id="bKm" type="button" aria-pressed="false" lang="km">ខ្មែរ</button>
    </div>
  </header>
  <div id="chat" aria-live="polite"></div>
  
  <form id="f">
    <input id="q" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-gramm="false">
    <button class="send" id="send" type="submit"></button>
  </form>
</div>
<div id="calc" role="dialog" aria-modal="true" aria-label="Calculator"><div class="cbox">

</div></div>

/* ============ Safe calculator (no eval) ============ */
function calc(str){
  let s=str.replace(/\s+/g,'').replace(/\u00d7/g,'*').replace(/\u00f7/g,'/').replace(/\u221a/g,'sqrt').replace(/[\u2212\u2013]/g,'-').replace(/π/g,'pi');
  {let o=0,c=0;for(const ch of s){if(ch==='(')o++;else if(ch===')')c++;}if(c>o)throw 0;s+=')'.repeat(o-c);}
  let i=0,pct=false;const peek=()=>s[i];
  const FN={sqrt:Math.sqrt,abs:Math.abs,round:Math.round,floor:Math.floor,ceil:Math.ceil,sin:x=>Math.sin(DEG?x*Math.PI/180:x),cos:x=>Math.cos(DEG?x*Math.PI/180:x),tan:x=>Math.tan(DEG?x*Math.PI/180:x),log:Math.log10,ln:Math.log};
  function expr(){let v=term();while(peek()==='+'||peek()==='-'){const o=s[i++];let r=term();if(pct)r=v*r;v=o==='+'?v+r:v-r}return v}
  function term(){pct=false;let v=unary(),used=false;
    for(;;){const c=peek();
      if(c==='*'||c==='/'||c==='%'){i++;const r=unary();used=true;v=c==='*'?v*r:c==='/'?v/r:v%r}
      else if(c==='('||(c&&/[a-z]/.test(c))){const r=unary();used=true;v=v*r}
      else break}
    if(used)pct=false;return v}
  function pow(){const b=atom();if(peek()==='^'){i++;return Math.pow(b,unary())}return b}
  function unary(){if(peek()==='-'){i++;return -unary()}if(peek()==='+'){i++;return unary()}return pow()}
  function atom(){
    if(peek()==='('){i++;const v=expr();if(peek()!==')')throw 0;i++;pct=false;return v}
    const w=/^[a-z]+/.exec(s.slice(i));
    if(w){i+=w[0].length;if(w[0]==='pi')return Math.PI;const f=FN[w[0]];if(!f)throw 0;return f(unary())}
    const m=/^\d*\.?\d+/.exec(s.slice(i));if(!m)throw 0;i+=m[0].length;let v=parseFloat(m[0]);
    if(peek()==='%'&&(!s[i+1]||/[+\-*\/^)]/.test(s[i+1]))){i++;pct=true;v=v/100}
    return v;
  }
  const v=expr();if(i!==s.length||!isFinite(v))throw 0;return v;
}
/* turn a typed question into a clean math expression, or null if it is not maths */
function mathText(text){
  let m=kd(text.toLowerCase()).trim().replace(/[?!\u17d4.\s]+$/,'');
  m=m.replace(/តើ|ស្មើនឹងប៉ុន្មាន|ស្មើប៉ុន្មាន|ស្មើអ្វី|ប៉ុន្មាន|equals what|equal to what/g,' ').replace(/(\d+(?:\.\d+)?)\s*%\s*នៃ\s*/g,'($1/100)*').replace(/\s+/g,' ').trim();
  m=m.replace(/^(what is|what's|whats|calculate|calc|compute|solve|evaluate|how much is|\u1782\u178e\u1793\u17b6)\s*/,'').replace(/\s*=\s*\??$/,'');
  m=m.replace(/(\d),(?=\d{3}(\D|$))/g,'$1');
  m=m.replace(/(\d+(?:\.\d+)?)\s*(?:%|percent)\s*of\s*/g,'($1/100)*');
  m=m.replace(/square root of\s*/g,'sqrt').replace(/to the power of/g,'^').replace(/\*\*/g,'^')
     .replace(/\b(?:multiplied by|times)\b/g,'*').replace(/\bdivided by\b/g,'/').replace(/\bplus\b/g,'+').replace(/\bminus\b/g,'-').replace(/\bmod\b/g,'%')
     .replace(/\u1794\u17bc\u1780/g,'+').replace(/\u178a\u1780/g,'-').replace(/\u1782\u17bb\u178e/g,'*').replace(/\u1785\u17c2\u1780/g,'/');
  m=m.replace(/(\d|\))\s*x\s*(?=[\d(.])/g,'$1*').trim();
  if(!m)return null;
  if(/[a-z]/.test(m.replace(/sqrt|abs|round|floor|ceil|sin|cos|tan|log|ln|pi/g,'')))return null;
  if(!/\d|pi/.test(m))return null;
  if(!/\d\s*pi|pi\s*\d|[+\-*\/%^\u00d7\u00f7\u221a]|sqrt|abs|round|floor|ceil|sin|cos|tan|log|ln/.test(m.replace(/^-/,'')))return null;
  return m;
}

async function moviePlot(term){
  const t0=term.replace(/\b(anime|movies?|films?|summary|synopsis|plot|story)\b/gi,' ').replace(/^\s*(of|the)\s+/i,'').replace(/\s+/g,' ').trim();
  if(!t0)return null;
  const s=await getJSON('https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&list=search&srlimit=6&srsearch='+encodeURIComponent(t0+' film'));
  const qw=words(t0);
  const hit=((s.query&&s.query.search)||[]).find(x=>{const tw=words(x.title);return qw.length&&qw.filter(w=>tw.includes(w)).length/qw.length>=0.6;});
  if(!hit)return null;
  const j=await getJSON('https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&prop=extracts|info&explaintext=1&exsectionformat=wiki&inprop=url&redirects=1&titles='+encodeURIComponent(hit.title),12000);
  const pg=Object.values(j.query.pages)[0],ex=(pg&&pg.extract)||'';
  const m=ex.match(/==\s*(?:Plot|Synopsis|Premise|Story|Summary)\s*==\s*([\s\S]*?)(?=\n==[^=]|$)/i);
  const intro=ex.split(/\n==[^=]/)[0].trim();
  const plot=(m?m[1]:'').replace(/={3,}[^=\n]+={3,}/g,'').replace(/\n{2,}/g,'\n').trim();
  return {title:pg.title,url:pg.fullurl,intro:intro.slice(0,900),plot:plot.slice(0,3800)};
}
async function movieAnswer(text){
  const wait=add('bot','<span class="dots"><span></span><span></span><span></span></span>');
  try{
    let en=clean(text);if(hasKhmer(en))en=clean(await toEn(en));
    en=(AL[ck(en)]||en);
    const mp=await moviePlot(en);
    if(!mp||!(mp.plot||mp.intro)){wait.remove();return false;}
    let title=mp.title,body=trimText((mp.plot||mp.intro).slice(0,lang==='km'?1700:2600)),note='';
    if(lang==='km'){try{const [ti,tx]=await Promise.all([mt(mp.title.replace(/\s*\(.*?\)\s*$/,''),'en|km'),translateLong(body,'en|km')]);title=ti+' ('+mp.title+')';body=tx;note=' '+t('trNote');}catch(e){}}
    wait.innerHTML='<h3>'+esc(title)+'</h3><b>'+esc(lang==='km'?'សង្ខេបរឿង':'Plot summary')+'</b><br><span>'+esc(body)+'</span><span class="src">'+esc(t('source'))+': Wikipedia. '+esc(lang==='km'?'ប្រយ័ត្ន៖ អាចបង្ហាញចុងបញ្ចប់នៃរឿង។ ':'Spoiler warning: this may reveal the ending. ')+esc(t('verify'))+note+'</span>'+links(text,mp.url);
    last={title:mp.title,text:mp.plot||mp.intro,lang:'en',url:mp.url,kind:'wiki',term:text};
    return true;
  }catch(e){wait.remove();return false;}
}

/* ============ Maths solver: equations and systems (no eval, checked by substitution) ============ */
const MFN=/sqrt|abs|round|floor|ceil|sin|cos|tan|log|ln|pi/g;
const L=(en,km)=>lang==='km'?km:en;
const zc=x=>Math.abs(x)<1e-9?0:Math.round(x*1e9)/1e9;
function fmt(v){
  if(Math.abs(v)<1e-12)return '0';
  const r=Math.round(v);if(Math.abs(v-r)<1e-9)return String(r);
  for(let q=2;q<=360;q++){const p=Math.round(v*q);if(Math.abs(v*q-p)<1e-9)return p+'/'+q;}
  return String(Math.round(v*1e6)/1e6);
}
function res(n,v){const s=fmt(v);if(/^-?\d+$/.test(s))return n+' = '+s;if(s.includes('/'))return n+' = '+s+' (≈ '+Math.round(v*1e4)/1e4+')';return n+' ≈ '+s;}
function terms(list){
  let o='';
  list.forEach(([k,s])=>{if(Math.abs(k)<1e-12)return;const ab=Math.abs(k);let n=(ab===1&&s)?'':fmt(ab);if(n.includes('/')&&s)n='('+n+')';o+=(o?(k<0?' - ':' + '):(k<0?'-':''))+n+s;});
  return o||'0';
}
function ev(side,vs,vals){let s=side;vs.forEach((v,i)=>{s=s.replace(new RegExp('(?<![a-z])'+v+'(?![a-z])','g'),'('+vals[i].toFixed(12)+')');});return calc(s);}
function parseEqs(text){
  let s=kd(text.toLowerCase()).replace(/[²³]/g,c=>c==='²'?'^2':'^3').replace(/[\u00d7\u00b7]/g,'*').replace(/\u00f7/g,'/').replace(/[\u2212\u2013\u2014]/g,'-');
  s=s.replace(/(\d),(?=\d{3}(\D|$))/g,'$1').replace(/\*\*/g,'^').replace(/[“”"']/g,'');
  s=s.replace(/[\u1780-\u17FF]+/g,';').replace(/[a-z]{2,}/g,w=>/^(sqrt|abs|round|floor|ceil|sin|cos|tan|log|ln|pi)$/.test(w)?w:';');
  const eqs=s.split(/[;,\n]+/).map(x=>x.trim()).filter(x=>x.indexOf('=')>0);
  if(!eqs.length||eqs.length>2)return null;
  for(const e of eqs){if(!/^[0-9a-z+\-*\/^().=\s]+$/.test(e)||e.split('=').length!==2)return null;}
  const vs=[...new Set(eqs.join('').replace(MFN,'').match(/[a-z]/g)||[])].sort();
  return {eqs,vs};
}
function solveOne(eq,v){
  const [l,r]=eq.split('=');if(!l.trim()||!r.trim())return null;
  const g=x=>ev(l,[v],[x])-ev(r,[v],[x]);
  const f0=g(0),f1=g(1),fm=g(-1),f2=g(2),f3=g(3);
  const c=zc(f0),a=zc((f1+fm)/2-f0),b=zc((f1-fm)/2),tl=x=>1e-7*(1+Math.abs(x));
  if(![c,a,b,f2,f3].every(isFinite)||Math.abs(f2-(4*a+2*b+c))>tl(f2)||Math.abs(f3-(9*a+3*b+c))>tl(f3))return null;
  let o=L('Equation: ','សមីការ៖ ')+eq.replace(/\s+/g,'')+'\n';
  const chk=x=>{const lv=ev(l,[v],[x]),rv=ev(r,[v],[x]),f=fmt(x);return L('Check ','ផ្ទៀងផ្ទាត់ ')+v+(/^-?\d+(\/\d+)?$/.test(f)?' = ':' ≈ ')+f+': '+L('left side','ខាងឆ្វេង')+' = '+fmt(lv)+', '+L('right side','ខាងស្តាំ')+' = '+fmt(rv)+(Math.abs(lv-rv)<1e-6*(1+Math.abs(lv))?' ✓':' ≈')+'\n';};
  const s1=L('Step 1: Move everything to one side: ','ជំហាន ១៖ ផ្ទេរអ្វីៗទាំងអស់ទៅម្ខាង៖ ');
  if(!a){
    if(!b)return o+(c?L('No solution: it simplifies to '+fmt(c)+' = 0, which is never true.','គ្មានចម្លើយ៖ វាសម្រួលទៅជា '+fmt(c)+' = 0 ដែលមិនពិតជានិច្ច។'):L('Every value of '+v+' is a solution (both sides are always equal).','រាល់តម្លៃនៃ '+v+' សុទ្ធតែជាចម្លើយ (ភាគីទាំងពីរស្មើគ្នាជានិច្ច)។'));
    const x=-c/b;
    o+=s1+terms([[b,v],[c,'']])+' = 0\n';
    o+=L('Step 2: Isolate '+v+': '+v+' = ','ជំហាន ២៖ រក '+v+'៖ '+v+' = ')+fmt(-c)+' ÷ '+(b<0?'('+fmt(b)+')':fmt(b))+'\n';
    o+=L('Step 3: ','ជំហាន ៣៖ ')+res(v,x)+'\n';
    return o+chk(x);
  }
  const D=zc(b*b-4*a*c);
  o+=s1+terms([[a,v+'^2'],[b,v],[c,'']])+' = 0\n';
  o+=L('Step 2: a = ','ជំហាន ២៖ a = ')+fmt(a)+', b = '+fmt(b)+', c = '+fmt(c)+'\n';
  o+=L('Step 3: Discriminant Δ = b² − 4ac = ','ជំហាន ៣៖ Δ = b² − 4ac = ')+'('+fmt(b)+')² − 4·('+fmt(a)+')·('+fmt(c)+') = '+fmt(D)+'\n';
  if(D<0){const re=-b/(2*a),im=Math.sqrt(-D)/(2*Math.abs(a));return o+L('Δ < 0, so there is no real solution. The complex roots are ','Δ < 0 ដូច្នេះគ្មានឫសពិតទេ។ ឫសកុំផ្លិចគឺ ')+v+' = '+fmt(re)+' ± '+fmt(im)+'i (≈ '+Math.round(im*1e4)/1e4+'i)\n';}
  if(D===0){const x=-b/(2*a);return o+L('Step 4: Δ = 0, one (double) root: ','ជំហាន ៤៖ Δ = 0 មានឫសមួយ (ឫសឌុប)៖ ')+v+' = −b ÷ 2a = '+fmt(-b)+' ÷ '+fmt(2*a)+'\n→ '+res(v,x)+'\n'+chk(x);}
  const sq=Math.sqrt(D),xs=[(-b+sq)/(2*a),(-b-sq)/(2*a)].sort((p,q)=>p-q);
  o+=L('Step 4: Δ > 0, two roots: ','ជំហាន ៤៖ Δ > 0 មានឫសពីរ៖ ')+v+' = (−b ± √Δ) ÷ 2a = ('+fmt(-b)+' ± √'+fmt(D)+') ÷ '+fmt(2*a)+'\n';
  o+='→ '+res(v+'₁',xs[0])+'\n→ '+res(v+'₂',xs[1])+'\n';
  return o+chk(xs[0])+chk(xs[1]);
}
function coef(eq,vs){
  const [l,r]=eq.split('=');if(!l.trim()||!r.trim())return null;
  const g=(p,q)=>ev(l,vs,[p,q])-ev(r,vs,[p,q]),g0=g(0,0),a=g(1,0)-g0,b=g(0,1)-g0;
  if(Math.abs(g(1,1)-g0-(a+b))>1e-7||Math.abs(g(2,3)-g0-(2*a+3*b))>1e-7||Math.abs(g(-1,2)-g0-(-a+2*b))>1e-7)return null;
  const out=[zc(a),zc(b),zc(-g0)];return out.every(isFinite)?out:null;
}
function solveTwo(eqs,vs){
  const A=coef(eqs[0],vs),B=coef(eqs[1],vs);if(!A||!B)return null;
  const [u,w]=vs,[a1,b1,c1]=A,[a2,b2,c2]=B;
  const D=zc(a1*b2-a2*b1),Du=zc(c1*b2-c2*b1),Dw=zc(a1*c2-a2*c1);
  const line=(a,b,c)=>terms([[a,u],[b,w]])+' = '+fmt(c);
  let o=L('System of equations:','ប្រព័ន្ធសមីការ៖')+'\n(1) '+line(a1,b1,c1)+'\n(2) '+line(a2,b2,c2)+'\n'+L('Method: determinants (Cramer’s rule).','វិធី៖ ដេទែរមីណង់ (Cramer)។')+'\n';
  o+='D = a₁b₂ − a₂b₁ = ('+fmt(a1)+')('+fmt(b2)+') − ('+fmt(a2)+')('+fmt(b1)+') = '+fmt(D)+'\n';
  if(D===0)return o+(Du===0&&Dw===0?L('D = 0 and the equations are dependent: infinitely many solutions.','D = 0 ហើយសមីការទាំងពីរពឹងផ្អែកគ្នា៖ មានចម្លើយច្រើនរាប់មិនអស់។'):L('D = 0 and the equations conflict: no solution.','D = 0 ហើយសមីការទាំងពីរផ្ទុយគ្នា៖ គ្មានចម្លើយ។'));
  const x=Du/D,y=Dw/D;
  o+='D'+u+' = c₁b₂ − c₂b₁ = '+fmt(Du)+'\nD'+w+' = a₁c₂ − a₂c₁ = '+fmt(Dw)+'\n';
  o+=u+' = D'+u+' ÷ D = '+fmt(Du)+' ÷ '+fmt(D)+'  →  '+res(u,x)+'\n'+w+' = D'+w+' ÷ D = '+fmt(Dw)+' ÷ '+fmt(D)+'  →  '+res(w,y)+'\n';
  [0,1].forEach(i=>{const [l,r]=eqs[i].split('='),lv=ev(l,vs,[x,y]),rv=ev(r,vs,[x,y]);o+=L('Check ('+(i+1)+'): ','ផ្ទៀងផ្ទាត់ ('+(i+1)+')៖ ')+fmt(lv)+' = '+fmt(rv)+(Math.abs(lv-rv)<1e-6*(1+Math.abs(lv))?' ✓':' ≈')+'\n';});
  return o;
}
function solveMath(text){
  try{
    const P=parseEqs(text);if(!P)return null;
    let o=null;
    if(P.eqs.length===1&&P.vs.length===1)o=solveOne(P.eqs[0],P.vs[0]);
    else if(P.eqs.length===2&&P.vs.length===2)o=solveTwo(P.eqs,P.vs);
    return o?o.trim():null;
  }catch(e){return null;}
}

const WORDQ=/ប៉ុន្មាន|សល់|សរុប|ចំនួន|អស់|ហូប|ញ៉ាំ|ទិញ|លក់|ឲ្យ|ឱ្យ|បាត់|ខ្វះ|ច្រើនជាង|តិចជាង|ម្នាក់|ក្នុងមួយ|\b(how many|how much|left|remain|remaining|total|altogether|more than|less than|share|each|per|twice|half|average)\b/i;
const isWord=s=>{const n=kd(s).match(/\d+(?:\.\d+)?/g)||[];return n.length>=2&&n.every(x=>+x<1000)&&WORDQ.test(s)&&s.length<500;};
function wordLocal(text){
  const s=kd(text),nums=(s.match(/\d+(?:\.\d+)?/g)||[]).map(Number);
  if(nums.length!==2||nums.some(n=>n>=1000))return null;
  const SUB=/ហូប|អស់|លក់|ឲ្យ|ឱ្យ|បាត់|ខូច|ចំណាយ|ញ៉ាំ|ផឹក|ដក|\b(ate|eaten|eat|gave|give|sold|sell|lost|spent|used|broke|took|minus|removed)\b/i;
  const ADD=/ទិញ|បន្ថែម|បូក|សរុប|រួម|ទទួលបាន|បានមក|ម្នាក់|ក្នុងមួយ|គុណ|ចែក|ដង|ពាក់កណ្តាល|\b(bought|buy|more|total|altogether|together|add|plus|each|per|times|half|every|divide|share|twice|double)\b/i;
  const ASK=/ប៉ុន្មាន|សល់|\b(left|remain|remaining|how many|how much)\b/i;
  if(!SUB.test(s)||ADD.test(s)||!ASK.test(s)||nums[0]<nums[1])return null;
  const r=Math.round((nums[0]-nums[1])*1e9)/1e9;
  return L(r+' left.\nWorking: '+nums[0]+' − '+nums[1]+' = '+r,'នៅសល់ '+r+'។\nវិធី៖ '+nums[0]+' − '+nums[1]+' = '+r);

function parseFollow(text){
  const x=text.trim().replace(/[?!។.]+$/,'').toLowerCase();
  const lg=w=>/khmer|cambodian|ខ្មែរ/.test(w)?'km':'en';
  let m;
  if(/^(tell me more|more|more info|more details|go on|continue|explain more|ប្រាប់បន្ថែម|បន្ថែម|ពន្យល់បន្ថែម)$/.test(x))return{more:true};
  if(m=x.match(/^(?:please\s+|can you\s+|could you\s+)?(?:translate|say|answer|explain|write|tell me|give me|show me)\s*(?:it|this|that|the answer|that answer|them)?\s*(?:to|in|into)?\s*(?:the\s+)?(khmer|cambodian|english)(?:\s+language)?(?:\s+please)?$/))return{to:lg(m[1])};
  if(m=x.match(/^(?:please\s+)?(?:in|to|into)\s+(?:the\s+)?(khmer|cambodian|english)(?:\s+language)?(?:\s+please)?$/))return{to:lg(m[1])};
  if(m=x.match(/^(khmer|cambodian|english)\s+please$/))return{to:lg(m[1])};
  if(/^(?:please\s+)?translate(?:\s+(?:it|this|that))?$/.test(x)||/^(?:សូម)?បកប្រែ(?:វា|នេះ|ចម្លើយនេះ)?$/.test(x))return{to:'auto'};
  if((m=x.match(/^(?:សូម)?(?:បកប្រែ|ប្រាប់|ឆ្លើយ|ពន្យល់)?\s*(?:វា|នេះ|ចម្លើយនេះ)?\s*(?:ទៅ)?\s*(?:ជា)?\s*(?:ភាសា)?\s*(ខ្មែរ|អង់គ្លេស)\s*(?:ផង|វិញ)?$/))&&/បកប្រែ|ប្រាប់|ឆ្លើយ|ពន្យល់|ទៅ|ជា/.test(x))return{to:lg(m[1])};

async function fetchLinked(from,title,to){

    +(to==='km'?'exchars=1200':'exsentences=5')+'&inprop=url&piprop=thumbnail&pithumbsize=200&redirects=1&titles='+encodeURIComponent(ll['*']));

async function streamOnce(url,headers,body,ms,onText){
  const c=new AbortController();let id=setTimeout(()=>c.abort(),ms);

    const r=await fetch(url,{method:'POST',headers,body:JSON.stringify(body),signal:c.signal});
    if(!r.ok){const j=await r.json().catch(()=>({}));const m=(j.error&&(j.error.message||j.error))||('http '+r.status);const e=new Error(typeof m==='string'?m:JSON.stringify(m));e.status=r.status;throw e;}
    let text='',chunks=[],partial=false;
    const feed=line=>{
      if(line.indexOf('data:')!==0)return;
      let j;try{j=JSON.parse(line.slice(5).trim());}catch(e){return;}
      const cand=j.candidates&&j.candidates[0];if(!cand)return;
      if(cand.content&&cand.content.parts){const t=cand.content.parts.map(p=>p.text||'').join('');if(t){text+=t;onText(text);}}
      const g=cand.groundingMetadata&&cand.groundingMetadata.groundingChunks;if(g)chunks=chunks.concat(g);
    };
    try{
      const rd=r.body.getReader(),dec=new TextDecoder();let buf='';
      for(;;){
        const x=await rd.read();if(x.done)break;
        clearTimeout(id);id=setTimeout(()=>c.abort(),ms);
        buf+=dec.decode(x.value,{stream:true});
        const parts=buf.split(/\r?\n/);buf=parts.pop();parts.forEach(feed);
      }
      buf+=dec.decode();if(buf)feed(buf);
    }catch(e){if(!text)throw e;partial=true;}
    return {candidates:[{content:{parts:[{text}]},groundingMetadata:{groundingChunks:chunks}}],_partial:partial};
  }finally{clearTimeout(id);}
}

        if(text)return {text,sources:chunks.filter(c=>c.web&&c.web.uri).map(c=>({url:c.web.uri,title:c.web.title||c.web.uri})),partial:!!j._partial};
      }catch(e){
        if(e.status!==404||!lastErr)lastErr=e;
        if(keyErr(e)||e.name==='AbortError'||e instanceof TypeError)throw e;
        if(e.status===429)cool[model]=Date.now()+60000;
        if(e.status===429||e.status===404||e.status===500||e.status===503)break;   /* this model is unavailable or out of quota: go to the next model */
      }
    }
  }
  throw lastErr||new Error('empty');
}
async function callClaude(){
  const url='https://api.anthropic.com/v1/messages';
  const H={'content-type':'application/json','x-api-key':AI.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'};
  const base={model:AI.model||DEFAULT_MODEL.claude,max_tokens:6000,temperature:0,system:sysPrompt(),messages:hist.map(h=>({role:h.role,content:h.text}))};
  let j;
  try{j=await postJSON(url,H,Object.assign({tools:[{type:'web_search_20250305',name:'web_search',max_uses:5}]},base));}
  catch(e){if(e.status===400)j=await postJSON(url,H,base);else throw e;}
  const blocks=j.content||[];
  const text=blocks.filter(b=>b.type==='text').map(b=>b.text).join('').trim();
  const src=[];
  blocks.forEach(b=>{
    if(b.type==='web_search_tool_result'&&Array.isArray(b.content))b.content.forEach(x=>x.url&&src.push({url:x.url,title:x.title||x.url}));
    if(b.type==='text'&&Array.isArray(b.citations))b.citations.forEach(x=>x.url&&src.push({url:x.url,title:x.title||x.url}));
  });
  return {text,sources:src};
}
async function gather(text){

    if(hasKhmer(term))en=clean(await toEn(term));

}
async function callOpenAI(o){

const md0=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/^#{1,6}\s*/gm,'').replace(/^\s*[*\-]\s+/gm,'• ');

/* ---- code blocks: Python (Pyodide), HTML / CSS / JavaScript (sandboxed preview) ---- */
const md=s=>{
  const blocks=[];
  s=String(s).replace(/```([a-zA-Z0-9+#-]*)[^\n]*\n([\s\S]*?)(```|$)/g,(m,lg,code)=>{
    lg=(lg||'text').toLowerCase();code=code.replace(/\n$/,'');
    const can=/^(python|py|html|css|js|javascript)$/.test(lg);
    blocks.push('<div class="code" data-lang="'+esc(lg)+'"><div class="ch"><span>'+esc(lg)+'</span><button type="button" data-act="copy">Copy</button>'+(can?'<button type="button" class="run" data-act="run">&#9654; Run</button>':'')+'</div><pre><code>'+esc(code)+'</code></pre><div class="out"></div><iframe sandbox="allow-scripts" title="preview"></iframe></div>');
    return '@@CODE'+(blocks.length-1)+'@@';
  });
  return md0(s).replace(/@@CODE(\d+)@@/g,(m,i)=>blocks[+i]);
};
let pyReady=null;
function loadPy(){
  if(pyReady)return pyReady;
  pyReady=new Promise((ok,no)=>{
    const sc=document.createElement('script');
    sc.src='https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js';
    sc.onload=()=>loadPyodide().then(ok,no);
    sc.onerror=()=>{pyReady=null;no(new Error('Cannot load Python (need internet).'));};
    document.head.appendChild(sc);
  });
  return pyReady;
}
document.getElementById('chat').addEventListener('click',async ev=>{
  const b=ev.target.closest('button[data-act]');if(!b)return;
  const box=b.closest('.code'),lg=box.dataset.lang,code=box.querySelector('code').textContent;
  const out=box.querySelector('.out'),fr=box.querySelector('iframe');
  if(b.dataset.act==='copy'){
    try{await navigator.clipboard.writeText(code);b.textContent='Copied';setTimeout(()=>b.textContent='Copy',1200);}catch(e){}
    return;
  }
  out.style.display='block';out.classList.remove('err');
  if(lg==='python'||lg==='py'){
    fr.style.display='none';out.textContent='Loading Python… (first time only, about 10 MB)';
    try{
      const py=await loadPy();let text='';
      py.setStdout({batched:x=>{text+=x+'\n';}});py.setStderr({batched:x=>{text+=x+'\n';}});
      out.textContent='Running…';
      const r=await py.runPythonAsync(code);
      if(r!==undefined&&r!==null&&String(r)!=='undefined')text+=String(r);
      out.textContent=text||'(finished, no output)';
    }catch(e){out.classList.add('err');out.textContent=String(e.message||e);}
  }else{
    let doc;
    if(lg==='css')doc='<!doctype html><meta charset="utf-8"><style>'+code+'</style><h1>Heading</h1><p>This is a paragraph with a <a href="#">link</a>.</p><button>Button</button><ul><li>One</li><li>Two</li></ul>';
    else if(lg==='html')doc=code;
    else doc='<!doctype html><meta charset="utf-8"><body><div id="app"></div><script>const log=(...a)=>document.body.insertAdjacentHTML("beforeend","<pre>"+a.join(" ").replace(/</g,"&lt;")+"</pre>");console.log=log;onerror=(m)=>log("Error: "+m);<\/script><script>'+code+'<\/script>';
    out.style.display='none';fr.style.display='block';fr.srcdoc=doc;
  }
});
function aiErr(e){
  if(e.name==='AbortError')return t('aiTimeout');
  if(e.status===401||e.status===403||(e.status===400&&/API key|api_key|authentication/i.test(e.message)))return t('aiKeyBad')+' ['+String(e.message||'').slice(0,140)+']';
  if(e.status===429)return t('aiLimit')+' ['+String(e.message||'').replace(/\s+/g,' ').slice(0,200)+']';
  if(e instanceof TypeError)return t('aiNet');
  return String(e.message||e).slice(0,400);
}
async function askAI(text,fl,skipRs){
  const wait=add('bot','<span class="dots"><span></span><span></span><span></span></span>');
  let rs=null,U=null,spec=null,live=true,rafP=0,lastT='';
  const onT=txt=>{lastT=txt;if(rafP)return;rafP=requestAnimationFrame(()=>{rafP=0;if(!live)return;try{wait.innerHTML='<span lang="'+(hasKhmer(lastT)?'km':'en')+'">'+md(lastT)+'</span>';chat.scrollTop=chat.scrollHeight;}catch(e){}});};
  const doU=!skipRs&&!fl&&!parseFollow(text)&&!parseTranslate(text)&&!MAKEQ.test(text)&&!STUDYQ.test(text);
  /* start looking things up while the question is being understood, so the two run at the same time */
  if(doU&&!MATHY.test(text)&&!isWord(text)&&!HARDQ.test(text)&&!CONV(text))spec=Promise.race([research(text),new Promise(r=>setTimeout(()=>r(null),5000))]).catch(()=>null);
  if(doU){
    U=await understand(text);const sr=solveUnderstood(U);
    if(sr){showUnderstood(wait,sr,text);hist.push({role:'user',text:text},{role:'assistant',text:sr.plain});while(hist.length>16)hist.shift();chat.scrollTop=chat.scrollHeight;return;}
  }
  const gm=MAKEQ.test(text)?'make':STUDYQ.test(text)?'study':U?(/^(math_other|equation)$/.test(U.type)?'hard':U.type==='word_problem'?'word':''):(HARDQ.test(text)?'hard':isWord(text)?'word':'');
  const useR=(gm==='make'||gm==='study')?false:U?!!(U.type==='entity'&&U.entity):(!MATHY.test(text)&&!isWord(text)&&!HARDQ.test(text)&&!CONV(text));
  try{if(!skipRs&&useR&&!parseFollow(text)){
    rs=(spec&&(!U||(U.entity&&!U.web&&ck(clean(U.entity))===ck(clean(text)))))?await spec:await Promise.race([research(U&&U.entity?U.entity+(U.web?' latest news':''):(fl?fl.t:text)),new Promise(r=>setTimeout(()=>r(null),5000))]);
  }}catch(e){}
  const frame=rs&&rs.title?ck(text).replace(ck(clean(fl?fl.t:text)),''):'';
  const ckey=rs&&rs.sure&&rs.pure&&!FRESH.test(text)?(fl?'km':lang)+'|'+ck(rs.title)+'|'+frame:null;
  let um=fl?fl.q+'\n[Answer language: Khmer. This is an information request: write the full, detailed information directly in Khmer. Do not translate the question or the answer from English; translate only if I explicitly ask.]':text;
  if(U&&U.restated)um+='\n[Understood question: '+U.restated+'. Answer exactly this question and nothing else.]';
  hist.push({role:'user',text:rs&&rs.title&&rs.sure&&rs.ctx?um+'\n[Optional background from websites about "'+rs.title+'". Use it only if it really matches what the person asked; if it does not match, ignore it completely and answer the actual question yourself. Different spellings of the same name mean the same topic. Notes: '+rs.ctx+']':um});
  try{
    const main=()=>AI.provider==='claude'?callClaude():AI.provider==='gemini'?callGemini(gm,onT):callOpenAI(),dsAI={provider:'deepseek',key:AI.ds,model:(gm==='hard'||gm==='make')?'deepseek-reasoner':''};
    let used=AI.key?AI.provider:'deepseek';
    const r=(ckey&&acache.get(ckey))||(AI.key?(AI.ds&&AI.provider!=='deepseek'?await main().catch(e1=>{used='deepseek';return callOpenAI(dsAI).catch(e2=>{throw Object.assign(new Error('Gemini: '+aiErr(e1)+' | DeepSeek: '+aiErr(e2)),{status:0});});}):await main()):await callOpenAI(dsAI));
    live=false;if(rafP)cancelAnimationFrame(rafP);if(ckey&&r.text&&!r.partial)acache.set(ckey,r);
    if(!r.text)throw new Error(t('aiEmpty'));
    hist.push({role:'assistant',text:r.text});
    while(hist.length>16)hist.shift();
    const seen=new Set(),src=r.sources.concat(rs&&rs.sure?rs.sources:[]).filter(x=>x.url&&!seen.has(x.url)&&seen.add(x.url)).slice(0,8);
    wait.innerHTML='<span class="aibadge">'+esc(t('aiBadge')+' · '+({gemini:'Gemini + Google Search',claude:'Claude + web search',deepseek:'DeepSeek',openai:'OpenAI'}[used]||used))+'</span><br><span lang="'+(hasKhmer(r.text)?'km':'en')+'">'+md(r.text)+'</span>'
      +(src.length?'<div class="aisrc" aria-label="'+esc(t('aiSources'))+'">'+src.map(x=>'<a target="_blank" rel="noopener" href="'+esc(x.url)+'">'+esc(x.title)+'</a>').join('')+'</div>':'')
      +links(text);
  }catch(e){
    live=false;if(rafP)cancelAnimationFrame(rafP);hist.pop();
    if(gm==='make'||gm==='study'){wait.innerHTML='<span class="warn">'+esc(aiErr(e))+'</span><div class="links"><button type="button" data-retry="'+esc(text)+'">'+esc(L('Try again','សាកម្តងទៀត'))+'</button></div>';chat.scrollTop=chat.scrollHeight;return;}
    wait.innerHTML='<span class="warn">'+esc(aiErr(e))+'</span>'+esc(t('aiFallback'));
    await ask(text,true,fl);
  }
  chat.scrollTop=chat.scrollHeight;
}

/* ============ Calculator: expressions, equations and plain-language questions ============ */
let DEG=true,ANS='';
const FACT=n=>{let r=1;for(let i=2;i<=n;i++)r*=i;return r;};
const fmtN=v=>(Math.round(v*1e10)/1e10).toLocaleString('en-US',{maximumFractionDigits:10});
function cNorm(raw){
  let s=raw.trim().replace(/π/g,'pi').replace(/[×·]/g,'*').replace(/÷/g,'/').replace(/[−–—]/g,'-').replace(/√/g,'sqrt').replace(/²/g,'^2').replace(/³/g,'^3').replace(/\s+/g,' ');
  return s.replace(/(\d+(?:\.\d+)?)!/g,(m,n)=>{n=+n;return Number.isInteger(n)&&n<=20?String(FACT(n)):'?';});
}
function cCompute(raw){
  const had=/=\s*$/.test(raw);let s=cNorm(raw.replace(/=\s*$/,''));if(!s)return null;
  const sm=solveMath(had&&/[a-z]/.test(s.replace(MFN,''))&&!s.includes('=')?s+'=0':s);if(sm)return sm;
  if(s.includes('='))return null;
  try{const v=calc(mathText(s)||s.toLowerCase().replace(/\s+/g,''));ANS=String(Math.round(v*1e10)/1e10);return raw.replace(/=\s*$/,'').trim()+' = '+fmtN(v);}
  catch(e){return /\/\s*0(?![\d.])/.test(s)?L('You cannot divide by zero.','មិនអាចចែកនឹងសូន្យបានទេ។'):null;}
}
const NLRE=raw=>hasKhmer(raw)||/[a-z]{2,}/.test(raw.toLowerCase().replace(MFN,''));
async function cAskNL(raw){
  const sm=solveMath(raw);if(sm)return sm;
  const mt0=mathText(raw);if(mt0){try{const v=calc(mt0);ANS=String(Math.round(v*1e10)/1e10);return raw+' = '+fmtN(v);}catch(e){}}
  const sx=smartMath(raw);if(sx)return sx.plain;
  const wl=wordLocal(raw);if(wl)return wl;
  const U=await understand(raw),r=solveUnderstood(U);
  if(r)return r.plain+'\n'+(r.U.lang==='km'?'ខ្ញុំយល់ថា៖ ':'I understood: ')+(r.U.restated||'');
  return (U&&U.restated?L('I understood: ','ខ្ញុំយល់ថា៖ ')+U.restated+'\n':'')+L('This is not a single calculation. Press "Send to chat" for a full answer.','នេះមិនមែនជាការគណនាតែមួយទេ។ សូមចុច «ផ្ញើទៅសន្ទនា» ដើម្បីទទួលចម្លើយពេញលេញ។');
}
